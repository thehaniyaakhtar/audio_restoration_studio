<!DOCTYPE html>
<html>

<head>

    <title>
        AI Audio Restoration Studio
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    <div class="hero">

        <h1>
            AI Audio Restoration Studio
        </h1>

        <p>
            Upload audio, remove noise,
            generate transcripts, and
            visualize signal quality.
        </p>

    </div>

    <form
        id="upload-form"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            id="audio"
            accept=".mp3,.wav"
            required
        >

        <button type="submit">
            Process Audio
        </button>

    </form>

    <div
        id="loading"
        style="display:none"
    >
        Processing Audio...
    </div>

    <div id="results"></div>

</div>

<script>

document
.getElementById("upload-form")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const file =
    document
    .getElementById("audio")
    .files[0];

    if(!file){
        return;
    }

    document
    .getElementById("loading")
    .style.display = "block";

    const formData =
    new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
        await fetch(
            "/process",
            {
                method: "POST",
                body: formData
            }
        );

        const data =
        await response.json();

        document
        .getElementById("results")
        .innerHTML = `

        <h2>Waveform Comparison</h2>

        <div class="results-grid">

            <div class="card">

                <h3>Original Waveform</h3>

                <img
                    src="${data.original_waveform}"
                    alt="Original Waveform"
                >

            </div>

            <div class="card">

                <h3>Cleaned Waveform</h3>

                <img
                    src="${data.waveform}"
                    alt="Cleaned Waveform"
                >

            </div>

        </div>

        <h2>Metrics</h2>

        <div class="metrics-grid">

            <div class="card">
                <h3>Duration</h3>
                <p>${data.metrics.duration}s</p>
            </div>

            <div class="card">
                <h3>Original RMS</h3>
                <p>${data.metrics.original_rms}</p>
            </div>

            <div class="card">
                <h3>Cleaned RMS</h3>
                <p>${data.metrics.cleaned_rms}</p>
            </div>

            <div class="card">
                <h3>Noise Reduction</h3>
                <p>${data.metrics.noise_reduction_percent}%</p>
            </div>

        </div>

        <h2>AI Assessment</h2>

        <div class="card">
            <p>${data.assessment}</p>
        </div>

        <h2>Transcript</h2>

        <div class="card">
            <p>${data.transcript}</p>
        </div>

        <h2>Downloads</h2>

        <div class="metrics-grid">

            <div class="card">
                <a
                    href="${data.cleaned_audio}"
                    download
                >
                    Download Cleaned Audio
                </a>
            </div>

            <div class="card">
                <a
                    href="http://127.0.0.1:8000/outputs/transcript.txt"
                    download
                >
                    Download Transcript
                </a>
            </div>

            <div class="card">
                <a
                    href="http://127.0.0.1:8000/outputs/report.txt"
                    download
                >
                    Download Report
                </a>
            </div>

        </div>

        <div class="results-grid">

            <div>

                <h2>Spectrogram Comparison</h2>

<div class="results-grid">

    <div class="card">

        <h3>Original Spectrogram</h3>

        <img
            src="${data.original_spectrogram}"
            alt="Original Spectrogram"
        >

    </div>

    <div class="card">

        <h3>Cleaned Spectrogram</h3>

        <img
            src="${data.spectrogram}"
            alt="Cleaned Spectrogram"
        >

    </div>

</div>

        <h2>Removed Components</h2>

        <img
            src="${data.difference_spectrogram}"
            alt="Difference Spectrogram"
        >

        `;
    }

    catch(error){

        document
        .getElementById("results")
        .innerHTML = `
            <h2>Error</h2>
            <p>
                Failed to process audio.
            </p>
        `;

        console.error(error);
    }

    finally{

        document
        .getElementById("loading")
        .style.display = "none";
    }

});

</script>

</body>

</html>
